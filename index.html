
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎧 DJ Deck - Virtual Mixer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ========================================== -->
    <!-- HEADER -->
    <!-- ========================================== -->
    <header>
        <h1>🎧 DJ Deck</h1>
        <p>Smart transitions • BPM matching • 1-Hour set builder</p>
    </header>

    <!-- ========================================== -->
    <!-- MAIN LAYOUT -->
    <!-- ========================================== -->
    <main>
        <!-- LEFT: PLAYER & VISUALIZER -->
        <section class="player-section">
            <!-- Now Playing -->
            <div class="now-playing" id="current-track">
                <strong>No track loaded</strong>
            </div>

            <!-- Visualizer -->
            <canvas id="visualizer" width="400" height="80"></canvas>

            <!-- Transport Controls -->
            <div class="controls">
                <button id="prev-btn" title="Previous">⏮</button>
                <button id="play-btn" title="Play / Pause">▶</button>
                <button id="next-btn" title="Next">⏭</button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <span class="time" id="time-current">0:00</span>
                <input type="range" id="progress" min="0" max="100" value="0" />
                <span class="time" id="time-total">0:00</span>
            </div>

            <!-- BPM & Key Display -->
            <div class="track-info">
                <span id="bpm-display">-- BPM</span>
                <span id="key-display">--</span>
            </div>
        </section>

        <!-- RIGHT: PLAYLIST -->
        <aside class="playlist-section">
            <div class="playlist-header">
                <h3>📋 Playlist</h3>
                <div class="playlist-actions">
                    <button id="upload-btn" title="Upload songs">📤 Upload</button>
                    <button id="build-set-btn" title="Build 1-hour set">⏱ Build Set</button>
                </div>
                <input type="file" id="file-input" accept="audio/*" multiple style="display:none" />
            </div>

            <div id="playlist" class="playlist-container">
                <!-- Tracks will be rendered here by JavaScript -->
                <p class="empty-message">No tracks yet. Upload some!</p>
            </div>
        </aside>
    </main>

    <!-- ========================================== -->
    <!-- SUGGESTION PANEL -->
    <!-- ========================================== -->
    <section class="suggestion-panel" id="suggestion">
        💡 Upload tracks to get transition suggestions
    </section>

    <!-- ========================================== -->
    <!-- SET BUILDER (hidden by default) -->
    <!-- ========================================== -->
    <section class="set-builder" id="set-builder" style="display:none;">
        <!-- Built by JavaScript -->
    </section>

    <!-- ========================================== -->
    <!-- FOOTER -->
    <!-- ========================================== -->
    <footer>
        <p>Made with ❤️ · Drop your songs in the <code>/songs</code> folder</p>
    </footer>

    <!-- ========================================== -->
    <!-- SCRIPTS -->
    <!-- ========================================== -->
    <script src="script.js"></script>
</body>
</html>
